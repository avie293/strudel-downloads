name: Update Player History

on:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Dependencies installieren
        run: pip install requests

      - name: Tracker-Skript ausführen
        run: python src/js/tracker.py

      - name: Änderungen in GitHub committen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/players_strudel.json
          git commit -m "Auto-update player history" || exit 0
          git push
